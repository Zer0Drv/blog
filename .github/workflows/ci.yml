name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 编译 + 测试（JDK 25）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & test
        run: mvn -B verify

  # 用真实 MySQL 8.4 跑 Flyway 迁移，校验 db/migration 下的 SQL 可执行
  flyway-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: blog123
          MYSQL_DATABASE: blog_dev
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pblog123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run Flyway migrations against MySQL 8.4
        run: >-
          docker run --rm --network host
          -v ${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql
          flyway/flyway:10
          -url="jdbc:mysql://127.0.0.1:3307/blog_dev?allowPublicKeyRetrieval=true&useSSL=false"
          -user=root -password=blog123
          -connectRetries=60
          migrate

  # Isolated app-level regressions against the actual drivers/services; no H2 or Redis/MinIO stubs.
  real-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Start disposable MySQL, Redis and MinIO
        run: docker compose -f compose.real-it.yaml up -d --wait --wait-timeout 150
      - name: Real HTTP flows, migration upgrades and backup restore drill
        run: |
          mkdir -p target/real-it-reports
          set -o pipefail
          mvn -B -Preal-it verify 2>&1 | tee target/real-it-reports/maven.log
      - name: Collect infrastructure diagnostics
        if: always()
        run: |
          mkdir -p target/real-it-reports
          docker compose -f compose.real-it.yaml ps -a > target/real-it-reports/containers.txt
          docker compose -f compose.real-it.yaml logs --no-color > target/real-it-reports/services.log 2>&1
      - name: Upload real dependency reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-dependencies-${{ github.sha }}
          path: target/real-it-reports/
          retention-days: 7
          if-no-files-found: error
      - name: Stop only disposable test services
        if: always()
        run: docker compose -f compose.real-it.yaml down --remove-orphans

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_E2E_DIR: ${{ github.workspace }}
    defaults:
      run:
        working-directory: browser-ui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Checkout exact frontend browser suite
        uses: actions/checkout@v7
        with:
          repository: Zer0Drv/blog-ui
          ref: 71ee5c8c6a43df6a7a47b78ab2566318c589eeb8
          path: browser-ui
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: browser-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Compile current backend fixture
        working-directory: .
        run: mvn -B -DskipTests package
      - name: Browser end-to-end flows
        run: pnpm test:e2e
      - name: Clean only this run's test infrastructure
        if: always()
        run: node e2e/cleanup.mjs
      - name: Save browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: browser-ui/e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
