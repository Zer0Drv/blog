name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 编译 + 测试（JDK 25）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & test
        run: mvn -B verify

  # 用真实 MySQL 8.4 跑 Flyway 迁移，校验 db/migration 下的 SQL 可执行
  flyway-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: blog123
          MYSQL_DATABASE: blog_dev
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pblog123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Run Flyway migrations against MySQL 8.4
        run: >-
          docker run --rm --network host
          -v ${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql
          flyway/flyway:10
          -url="jdbc:mysql://127.0.0.1:3307/blog_dev?allowPublicKeyRetrieval=true&useSSL=false"
          -user=root -password=blog123
          -connectRetries=60
          migrate
