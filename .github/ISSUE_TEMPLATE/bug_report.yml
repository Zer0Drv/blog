name: Bug 报告
description: 报告一个功能缺陷或异常
title: "[模块] 问题简述"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 1-3 句话说明现象与影响范围
      placeholder: 例如：点击登录按钮后页面无任何反应，无法登录。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从进入页面到触发问题的每一步操作（编号列表）
      placeholder: |
        1. 打开 xxx 页面
        2. 点击 xxx 按钮
        3. 观察到 xxx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 正确情况下应该发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际发生了什么（白屏 / 卡死 / 无响应等）
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器及版本、操作系统；后端问题补充接口地址与响应
      placeholder: 例如：Microsoft Edge 120 / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 浏览器 Console / Network 完整报错（文本粘贴，注意脱敏）
      render: shell
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 出现频率（必现/偶发）、截图录屏、临时绕过方法等
    validations:
      required: false
