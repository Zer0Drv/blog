name: 🐛 Bug 报告
description: 报告一个不符合预期的行为
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: current
    attributes:
      label: 实际现象
      description: 发生了什么？附错误信息、截图、日志片段
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 部署环境 / 版本 / 数据库与中间件版本（如与默认不同）
