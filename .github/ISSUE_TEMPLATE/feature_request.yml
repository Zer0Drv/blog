name: 功能建议
description: 提出一个新功能或改进建议
title: "[模块] 建议简述"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的痛点
      description: 当前使用中遇到的不便或缺失的能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 希望实现的效果，可附参考产品/截图
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他解决方式（可选）
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 使用场景、优先级期望等（可选）
    validations:
      required: false
