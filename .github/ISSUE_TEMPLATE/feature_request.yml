name: ✨ 功能请求
description: 提出一个新功能或改进
title: "[Feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 先谈用户场景与痛点，再谈方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提议方案
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 涉及哪些模块 / API / 数据表？是否有行为变化或数据迁移？
