spring:
  # 图片上传限制：单文件 / 单请求均 5MB（超限抛 MaxUploadSizeExceededException → FILE_TOO_LARGE）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    # 本地默认连 3307（docker 容器 blog-mysql）；可用环境变量覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:blog_dev}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 无默认口令（#2）：由 DB_PASSWORD 注入（本地开发见 .env.example，docker compose 共用同一变量）
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  docker:
    compose:
      enabled: false
  # 邮箱验证码 SMTP：配置后验证码走真实邮件；未配置时走 dev 兜底（验证码写入 Redis，
  # 日志不再打印明文，见 EmailCodeServiceImpl；用 redis-cli GET blog:email-code:<scene>:<email> 读取）
  # mail:
  #   host: smtp.example.com
  #   port: 465
  #   username: ${MAIL_USERNAME}
  #   password: ${MAIL_PASSWORD}
  #   properties:
  #     mail.smtp.ssl.enable: true
  # GitHub OAuth 登录（M6 启用）。创建 OAuth App 后配置 GITHUB_CLIENT_ID/SECRET 环境变量；
  # 回调地址固定为 http://localhost:8082/login/oauth2/code/github（详见 README「GitHub OAuth 登录」）。
  # 占位值仅保证无凭据时应用可正常启动，实际点击 GitHub 登录前必须换成真实凭据。
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:replace-me}
            client-secret: ${GITHUB_CLIENT_SECRET:replace-me}
            scope: [read:user, user:email]

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# MyBatis 的 SQL 日志器名 = Mapper 接口全限定名，默认 root=INFO 会压掉，需给 mapper 包开 DEBUG
logging:
  level:
    com.zer0drv.blog: debug

server:
  port: 8082

jwt:
  # 无默认值（#2）：必须由 JWT_SECRET 环境变量注入强随机密钥（≥32 字节），
  # 未配置或强度不足时 JwtConfig 直接启动失败（fail-fast）并给出明确提示
  secret: ${JWT_SECRET:}
  expiration-ms: 3600000
