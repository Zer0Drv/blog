spring:
  application:
    name: blog
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          # 本项目 JWT 的角色放在自定义声明 roles 中（值形如 ROLE_ADMIN）。
          # 默认的 JwtGrantedAuthoritiesConverter 只读 scope/scp 声明，且默认前缀是 SCOPE_，
          # 因此必须显式指定声明名并把前缀置空，否则 hasRole('ADMIN')/hasAuthority 会一律 403。
          authorities-claim-name: roles
          authority-prefix: ""

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 图片上传根目录（相对路径基于启动目录），可用环境变量 BLOG_UPLOAD_DIR 覆盖
blog:
  upload-dir: ${BLOG_UPLOAD_DIR:./uploads}
  # MinIO 对象存储（docker-compose 提供 minio 服务；bucket 创建与匿名下载策略由后端启动自检保证）；
  # MINIO_ENABLED=false 时上传回退本地磁盘（/uploads/** 由 WebMvcConfig 映射）
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:blog-images}
    # 拼返回 URL 用的浏览器可达地址，默认同 endpoint
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  # GitHub OAuth 登录成功/失败后的前端回跳地址
  oauth:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:5173/login?error=oauth_failed}
  # 自适应图形验证码：按 scene+来源计数，窗口内达到阈值后该来源必须过验证码（正常使用零打扰）
  captcha:
    # 验证码文本 Redis TTL（秒），一次性，校验一次即删
    code-ttl-seconds: 300
    scenes:
      # 登录失败 +1、登录成功清零（计数键：客户端 IP）
      login:
        threshold: 5
        window-seconds: 600
      # 注册尝试 +1（计数键：客户端 IP）
      register:
        threshold: 3
        window-seconds: 600
      # 发送邮箱验证码尝试 +1（计数键：客户端 IP）
      email-code:
        threshold: 5
        window-seconds: 600
      # 密码重置尝试 +1（计数键：客户端 IP）
      password-reset:
        threshold: 3
        window-seconds: 600
      # 发表评论 +1（计数键：当前用户 ID）
      comment:
        threshold: 10
        window-seconds: 600
