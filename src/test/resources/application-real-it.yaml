# Loaded explicitly by *RealIT; does not merge the fast H2/stub configuration or dev .env.
spring:
  application:
    name: blog-real-it
  datasource:
    url: ${REAL_IT_MYSQL_URL:jdbc:mysql://127.0.0.1:23307/blog_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${REAL_IT_DB_PASSWORD:blog-it-password}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: ${REAL_IT_REDIS_PORT:26379}
      database: 15
      connect-timeout: 3s
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: real-it-unused
            client-secret: real-it-unused
            scope: [read:user, user:email]
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
blog:
  admin:
    bootstrap-enabled: false
  subscription:
    worker-enabled: false
  security:
    trust-proxy-headers: false
    csrf-header-check-enabled: true
  auth:
    cookie:
      secure: false
      same-site: Strict
  search:
    fulltext-enabled: true
  minio:
    enabled: true
    endpoint: ${REAL_IT_MINIO_ENDPOINT:http://127.0.0.1:29000}
    public-url: ${REAL_IT_MINIO_ENDPOINT:http://127.0.0.1:29000}
    access-key: blog-it-user
    secret-key: blog-it-minio-password
  captcha:
    code-ttl-seconds: 300
    scenes:
      login:
        threshold: 3
        window-seconds: 60
jwt:
  secret: real-it-only-jwt-signing-key-32bytes-minimum
  expiration-ms: 3600000
