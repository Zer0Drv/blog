# 本地开发基础设施：MySQL 8.4（宿主 3307）+ Redis（6379）
# 用法：docker compose up -d   （停止：docker compose down；清空数据：down -v）
# 说明：pom.xml 已带 spring-boot-docker-compose，但 application-dev.yaml 里
#       spring.docker.compose.enabled=false（默认关闭，避免启动时隐式拉起容器）。
#       如需 Boot 自动接管 compose，把该开关打开即可。
services:
  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-blog123}
      MYSQL_DATABASE: ${DB_NAME:-blog_dev}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"          # 避开宿主可能已占用的 3306
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - blog-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - blog-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO 对象存储：API 9000 / 控制台 9001（minioadmin / minioadmin123）
  minio:
    image: minio/minio:latest
    container_name: blog-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - blog-minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # 一次性初始化：建 blog-images bucket 并开放匿名下载（图片直链由该策略提供）
  minio-init:
    image: minio/mc:latest
    container_name: blog-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/blog-images || true;
      mc anonymous set download local/blog-images;
      "

volumes:
  blog-mysql-data:
  blog-redis-data:
  blog-minio-data:
