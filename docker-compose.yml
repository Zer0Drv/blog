# 本地开发基础设施：MySQL 8.4（宿主 3307）+ Redis（6379）+ MinIO（9000/9001）
# bucket 创建与匿名下载策略由后端启动自检（MinioConfig#minioBucketCheck）完成，
# 不再依赖一次性 minio-init 容器（minio/mc 镜像已随上游 EOL 下架，无可靠来源）。
# 用法：cp .env.example .env 并填写口令后  docker compose up -d
#       （停止：docker compose down；清空数据：down -v）
# 说明：pom.xml 已带 spring-boot-docker-compose，但 application-dev.yaml 里
#       spring.docker.compose.enabled=false（默认关闭，避免启动时隐式拉起容器）。
#       如需 Boot 自动接管 compose，把该开关打开即可。
# 安全（#2）：所有口令/密钥一律从 .env 注入（compose 自动读取），仓库与 compose 文件
#       不再内置任何默认口令；未配置时 compose 直接报错拒绝启动。
services:
  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      # 无默认口令（#2）：必须在 .env 配置（参考 .env.example）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置：请复制 .env.example 为 .env 并填写强口令}
      MYSQL_DATABASE: ${DB_NAME:-blog_dev}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"          # 避开宿主可能已占用的 3306
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - blog-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - blog-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO 对象存储：API 9000 / 控制台 9001（账号口令由 .env 注入，无默认值）
  # 上游官方镜像 minio/minio 已 EOL 并从 Docker Hub 整体下架，改用社区构建的
  # alpine/minio 并 pin 到实测可拉取的版本（不要用 latest）。
  # 注意：该镜像以非 root 用户 uid:gid=100:101 运行，而 Docker 新建命名卷的属主是 root:root，
  # 因此**首次创建卷时也会**报 `unable to create (/data/.minio.sys/tmp) file access denied`
  # （2026-10-02 实测：down -v 全新卷同样复现；从旧官方镜像迁移的卷同理）。修法（一次性）：
  #   docker run --rm -v blog_blog-minio-data:/data alpine:3.20 sh -c 'chown -R 100:101 /data'
  #   然后 docker restart blog-minio
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: blog-minio
    restart: unless-stopped
    environment:
      # 无默认凭据（#2）：必须在 .env 配置（参考 .env.example）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 未设置：请复制 .env.example 为 .env 并填写}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 未设置：请复制 .env.example 为 .env 并填写强口令}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - blog-minio-data:/data
    healthcheck:
      # alpine/minio 镜像内不含 mc 二进制，改用 HTTP 健康端点（alpine 底自带 busybox wget）
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # 统一网关（Nginx）：模拟生产「CDN 边缘 + 反代」——
  # 前端静态资源走 MinIO blog-frontend 桶（边缘缓存），/api、/uploads、/ws 反代后端（宿主 8082）。
  # 前端发布 = 构建 dist 推到 MinIO 桶（deploy-frontend.sh），网关无需重启。
  gateway:
    image: nginx:1.29-alpine
    container_name: blog-gateway
    restart: unless-stopped
    ports:
      - "80:80"               # 对外唯一入口
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio

  # DBX 数据库管理工具（Web 版，Apache-2.0 开源）：统一管理 MySQL/Redis/MinIO(S3) 连接，
  # 其 MCP server（@dbx-app/mcp-server）可让 AI 代理通过这些连接查询。
  # 控制台 http://localhost:4224 ；数据（连接配置，加密存储）在 dbx-data 卷。
  dbx:
    image: t8y2/dbx:latest
    container_name: blog-dbx
    restart: unless-stopped
    pull_policy: always
    environment:
      DBX_WEB_PASSWORD: ${DBX_WEB_PASSWORD:?DBX_WEB_PASSWORD 未设置：Web 控制台登录口令，请写入 .env}
      TZ: Asia/Shanghai
    ports:
      - "4224:4224"
    volumes:
      - dbx-data:/app/data

volumes:
  blog-mysql-data:
  blog-redis-data:
  blog-minio-data:
  dbx-data:
