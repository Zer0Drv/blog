# blog 统一网关：模拟生产「CDN 边缘 + 反向代理」拓扑
#
# 拓扑：浏览器 → 本网关(80) ┬─ /api/* /uploads/* /ws → 后端（宿主 8082，开发期跑在容器外）
#                            ├─ /assets/*（内容哈希资源）→ MinIO blog-frontend 桶，边缘缓存 30 天
#                            └─ 其余路径 → MinIO blog-frontend 桶（SPA history 路由回退 index.html）
#
# 缓存策略与 Vite 产物配套：
#   - assets/* 文件名带内容哈希 →  immutable，长缓存 + 边缘缓存，发新版文件名必变，无脏缓存问题
#   - index.html → no-cache，浏览器每次校验，保证发新版即时可见
#   - 命中统计响应头 X-Cache-Status: HIT/MISS，便于演示「边缘命中 vs 回源」

proxy_cache_path /var/cache/nginx/blog-frontend
    levels=1:2 keys_zone=blogfe:10m max_size=256m inactive=30d use_temp_path=off;

# WebSocket 升级头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream blog_backend {
    # 后端开发期跑在容器外的宿主机上（mvn spring-boot:run）
    server host.docker.internal:8082;
}

upstream blog_minio {
    server minio:9000;
}

server {
    listen       80;
    server_name  _;

    gzip            on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_vary       on;

    # ---------- 后端：API / 上传文件 / WebSocket ----------
    # 前端 axios baseURL 为 /api，生产环境由网关剥掉前缀转发给后端
    location /api/ {
        proxy_pass http://blog_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://blog_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;   # WS 长连接
    }

    # 后端健康检查直通（监控/容器编排探针用）
    location = /actuator/health {
        proxy_pass http://blog_backend;
    }

    # ---------- 前端：MinIO blog-frontend 桶 ----------
    # 注意：必须显式重写 Host 为 minio:9000——MinIO 会校验 Host 主机名，
    # 浏览器带来的 Host（如 localhost）会被以 400 InvalidRequest(invalid hostname) 拒绝

    # Vite 产物：内容哈希命名，immutable + 边缘缓存 30 天
    # 桶内 key 与 dist 结构一致（assets/xxx），不能按前缀替换（会丢掉 assets/ 层），用 rewrite 原样加桶前缀
    location /assets/ {
        rewrite ^/(.*)$ /blog-frontend/$1 break;
        proxy_pass http://blog_minio;
        proxy_set_header Host minio:9000;
        proxy_cache blogfe;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # index.html 精确匹配：不缓存，发新版即时生效
    location = /index.html {
        proxy_pass http://blog_minio/blog-frontend/index.html;
        proxy_set_header Host minio:9000;
        add_header Cache-Control "no-cache" always;
    }

    # 站点根：S3 协议访问桶根返回的是 XML 列表而非首页，需显式指到 index.html
    location = / {
        proxy_pass http://blog_minio/blog-frontend/index.html;
        proxy_set_header Host minio:9000;
        add_header Cache-Control "no-cache" always;
    }

    # 其余路径（favicon、SEO 文件、Vue history 路由等）：先查 MinIO，未命中回退 index.html
    location / {
        proxy_pass http://blog_minio/blog-frontend/;   # 尾部斜杠必带：替换匹配前缀
        proxy_set_header Host minio:9000;
        proxy_intercept_errors on;          # 让 404 进入 error_page 逻辑
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        # named location 内 proxy_pass 不允许带 URI 部分，改用 rewrite 实现
        rewrite ^ /blog-frontend/index.html break;
        proxy_pass http://blog_minio;
        proxy_set_header Host minio:9000;
        add_header Cache-Control "no-cache" always;
    }
}
